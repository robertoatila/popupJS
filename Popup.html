<!DOCTYPE html>
<html>
    <head>
        <title>Exemplo Popup</title>
        <style>
            h1{
                color: red;
            }
        </style>
    </head>
    <script type="text/javascript">
        const data = new Date();
        const hora = data.getHours();
        if(hora >= 6 && hora < 12){
            window.alert("Bom Dia");
        } else if(hora >= 12 && hora < 18){
            window.alert("Boa Tarde");
        } else if(hora >= 18 && hora < 23){
            window.alert("Boa Noite");
        } else {
            window.alert("Boa Madrugada");
        }
        </script>
        <body>
            <h1> Página sobre Jornalismo</h1>
        </body>
</html>
